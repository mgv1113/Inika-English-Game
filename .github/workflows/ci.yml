name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inika
          POSTGRES_PASSWORD: inika
          POSTGRES_DB: inika_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inika"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://inika:inika@localhost:5432/inika_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/server.Dockerfile .
      - run: docker build -f deploy/web.Dockerfile .
      - run: docker run --rm -v "$PWD/deploy:/d:ro" caddy:2-alpine caddy validate --config /d/Caddyfile --adapter caddyfile
